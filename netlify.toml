# Netlify configuration for Cobecium web app (Vite + React SPA)
# NOTE: Public Netlify hosting is paused (Entra auth cutover). Kept for reference only.
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "VITE_ENTRA_CLIENT_ID,VITE_ENTRA_TENANT_ID,ENTRA_CLIENT_ID,ENTRA_TENANT_ID"

# SPA: serve index.html for routes that don't match a static file
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
