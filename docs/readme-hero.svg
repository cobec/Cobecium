<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Lynx  Procurement hub</title>
  <desc id="desc">Cobec Lynx procurement hub. Spark LAN port 9560. Not on Funnel. Tailscale LAN only.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2EC4B6" stroke-width="0.7" opacity="0.18"/>
    </pattern>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2438"/>
      <stop offset="0.55" stop-color="#071422"/>
      <stop offset="1" stop-color="#0A1C2C"/>
    </linearGradient>
    <linearGradient id="earFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C45C26"/>
      <stop offset="1" stop-color="#E07A3A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#wash)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="320" fill="#2EC4B6"/>
  <rect x="8" y="0" width="4" height="320" fill="#C45C26"/>

  <!-- procurement card grid (unique mark, not a photo lynx) -->
  <g transform="translate(56,78)" fill="none" stroke="#2EC4B6" stroke-width="1.6">
    <rect x="0" y="0" width="52" height="40" rx="4" opacity="0.55"/>
    <rect x="60" y="0" width="52" height="40" rx="4" opacity="0.85"/>
    <rect x="120" y="0" width="52" height="40" rx="4" stroke="#C45C26" stroke-width="2" opacity="1"/>
    <rect x="0" y="48" width="52" height="40" rx="4" opacity="0.7"/>
    <rect x="60" y="48" width="52" height="40" rx="4" opacity="0.45"/>
    <rect x="120" y="48" width="52" height="40" rx="4" opacity="0.75"/>
    <rect x="0" y="96" width="52" height="40" rx="4" opacity="0.4"/>
    <rect x="60" y="96" width="52" height="40" rx="4" opacity="0.9"/>
    <rect x="120" y="96" width="52" height="40" rx="4" opacity="0.5"/>
    <circle cx="146" cy="20" r="3.5" fill="#C45C26" stroke="none"/>
    <circle cx="26" cy="116" r="3.5" fill="#2EC4B6" stroke="none"/>
  </g>

  <!-- geometric lynx: tufted ears + angular muzzle over the grid -->
  <g transform="translate(248,52)" filter="url(#glow)">
    <!-- left ear + tuft -->
    <path d="M18 78 L48 8 L78 78 Z" fill="#0A1C2C" stroke="#2EC4B6" stroke-width="3" stroke-linejoin="round"/>
    <path d="M38 70 L48 28 L58 70 Z" fill="url(#earFill)" opacity="0.95"/>
    <path d="M48 8 L42 -6 L54 8" fill="none" stroke="#C45C26" stroke-width="2.5" stroke-linecap="round"/>
    <!-- right ear + tuft -->
    <path d="M102 78 L132 8 L162 78 Z" fill="#0A1C2C" stroke="#2EC4B6" stroke-width="3" stroke-linejoin="round"/>
    <path d="M122 70 L132 28 L142 70 Z" fill="url(#earFill)" opacity="0.95"/>
    <path d="M132 8 L126 -6 L138 8" fill="none" stroke="#C45C26" stroke-width="2.5" stroke-linecap="round"/>
    <!-- skull / cheeks -->
    <path d="M28 86 L90 70 L152 86 L168 150 L90 198 L12 150 Z" fill="#0C2438" stroke="#2EC4B6" stroke-width="3" stroke-linejoin="round"/>
    <!-- inner face facet -->
    <path d="M52 108 L90 96 L128 108 L118 150 L90 168 L62 150 Z" fill="#071422" stroke="#2EC4B6" stroke-width="1.5" opacity="0.95"/>
    <!-- eyes -->
    <polygon points="68,128 80,120 90,132 80,140" fill="#2EC4B6"/>
    <polygon points="110,128 122,120 132,132 122,140" fill="#2EC4B6"/>
    <polygon points="78,128 80,124 82,128 80,132" fill="#071422"/>
    <polygon points="120,128 122,124 124,128 122,132" fill="#071422"/>
    <!-- nose / muzzle -->
    <polygon points="90,148 80,162 100,162" fill="#C45C26"/>
    <path d="M90 162 L90 176" stroke="#C45C26" stroke-width="2" stroke-linecap="round"/>
    <path d="M90 176 Q70 188 52 180" fill="none" stroke="#2EC4B6" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M90 176 Q110 188 128 180" fill="none" stroke="#2EC4B6" stroke-width="1.8" stroke-linecap="round"/>
    <!-- whiskers -->
    <path d="M40 150 L8 142M40 160 L6 160M40 170 L10 178" fill="none" stroke="#2EC4B6" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
    <path d="M140 150 L172 142M140 160 L174 160M140 170 L170 178" fill="none" stroke="#2EC4B6" stroke-width="1.4" opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(500,78)" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="0" y="78" fill="#F4FBFA" font-size="92" font-weight="800" letter-spacing="10">LYNX</text>
    <text x="4" y="122" fill="#2EC4B6" font-size="26" font-weight="600" letter-spacing="6">PROCUREMENT HUB</text>
    <rect x="4" y="138" width="72" height="5" fill="#C45C26"/>
    <text x="4" y="172" fill="#9BB8B4" font-size="16" font-weight="500" letter-spacing="1.2">State / city portals · federal Opportunities at /opps</text>
  </g>

  <!-- Spark LAN badge  explicitly not Funnel -->
  <g transform="translate(980,42)" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="256" height="92" rx="10" fill="#0A1C2C" stroke="#2EC4B6" stroke-width="2"/>
    <rect x="0" y="0" width="8" height="92" rx="4" fill="#C45C26"/>
    <text x="24" y="32" fill="#9BB8B4" font-size="12" font-weight="700" letter-spacing="2.4">SPARK LAN · NOT FUNNEL</text>
    <text x="24" y="64" fill="#F4FBFA" font-size="28" font-weight="800" letter-spacing="1">:9560</text>
    <text x="24" y="118" fill="#C45C26" font-size="13" font-weight="700" letter-spacing="1.4">TAILSCALE LAN ONLY</text>
  </g>
</svg>
